name: Package Jaket Mobile interop toolchain

on:
  push:
    branches:
      - jaket-mobile-v0.1-build
    paths:
      - '.github/workflows/diag-jaket-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Download Unity 2019.4.40 base libraries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/jm-toolchain/unity
          curl -L --fail --retry 3 'https://unity.bepinex.dev/libraries/2019.4.40.zip' -o /tmp/unity.zip
          unzip -q /tmp/unity.zip -d /tmp/jm-toolchain/unity
          test -f /tmp/jm-toolchain/unity/UnityEngine.CoreModule.dll

      - name: Package portable .NET 6 runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/jm-toolchain/dotnet/host/fxr /tmp/jm-toolchain/dotnet/shared/Microsoft.NETCore.App
          cp /usr/share/dotnet/dotnet /tmp/jm-toolchain/dotnet/
          cp -a /usr/share/dotnet/host/fxr/6.0.36 /tmp/jm-toolchain/dotnet/host/fxr/
          cp -a /usr/share/dotnet/shared/Microsoft.NETCore.App/6.0.36 /tmp/jm-toolchain/dotnet/shared/Microsoft.NETCore.App/
          /tmp/jm-toolchain/dotnet/dotnet --list-runtimes
          tar -C /tmp -czf /tmp/JaketMobile-interop-toolchain.tar.gz jm-toolchain
          ls -lh /tmp/JaketMobile-interop-toolchain.tar.gz

      - name: Upload portable interop toolchain
        uses: actions/upload-artifact@v4
        with:
          name: JaketMobile-interop-toolchain-gzip
          path: /tmp/JaketMobile-interop-toolchain.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
