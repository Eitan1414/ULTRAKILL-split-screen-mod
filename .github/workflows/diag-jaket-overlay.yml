name: Package Jaket Mobile Unity managed references

on:
  push:
    branches:
      - jaket-mobile-v0.1-build
    paths:
      - '.github/workflows/diag-jaket-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity-managed-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore UnityEngine.Modules 2019.4.40
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/unity-managed
          cd /tmp/unity-managed
          cat > UnityRefs.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <RestoreAdditionalProjectSources>https://nuget.samboy.dev/v3/index.json;https://api.nuget.org/v3/index.json</RestoreAdditionalProjectSources>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="UnityEngine.Modules" Version="2019.4.40" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore UnityRefs.csproj --source https://nuget.samboy.dev/v3/index.json --source https://api.nuget.org/v3/index.json
          PKG="$HOME/.nuget/packages/unityengine.modules/2019.4.40"
          test -d "$PKG"
          find "$PKG" -maxdepth 5 -type f -printf '%P\n' | sort | head -250
          tar -C "$HOME/.nuget/packages" -czf /tmp/UnityEngine.Modules-2019.4.40.tar.gz unityengine.modules/2019.4.40
          ls -lh /tmp/UnityEngine.Modules-2019.4.40.tar.gz

      - name: Upload Unity managed references
        uses: actions/upload-artifact@v4
        with:
          name: UnityEngine.Modules-2019.4.40
          path: /tmp/UnityEngine.Modules-2019.4.40.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
