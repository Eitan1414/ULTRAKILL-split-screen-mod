name: Diagnose Jaket Mobile interop toolchain

on:
  push:
    branches:
      - jaket-mobile-v0.1-build
    paths:
      - '.github/workflows/diag-jaket-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify UltraDroid extracted input is downloadable
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://drive.usercontent.google.com/download?id=1NAdCfh6OFp1xfnz69_tqCx95_gn67Hso&export=download&confirm=t'
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o /tmp/JaketMobile_build_input_TEMP.zip
          ls -lh /tmp/JaketMobile_build_input_TEMP.zip
          unzip -t /tmp/JaketMobile_build_input_TEMP.zip
          unzip -l /tmp/JaketMobile_build_input_TEMP.zip

      - name: Probe Il2CppInterop CLI package
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE='https://nuget.bepinex.dev/v3/index.json'
          dotnet package search Il2CppInterop.CLI --source "$SOURCE" --take 30 --format json
          mkdir -p /tmp/interop-cli
          dotnet tool install Il2CppInterop.CLI --tool-path /tmp/interop-cli --add-source "$SOURCE" --prerelease
          /tmp/interop-cli/il2cppinterop --help
          /tmp/interop-cli/il2cppinterop generate --help

      - name: Verify Unity 2019.4.40 base libraries
        shell: bash
        run: |
          set -euxo pipefail
          for version in 2019.4.40 2019.4.40f1; do
            echo "=== $version ==="
            if curl -L --fail --retry 2 "https://unity.bepinex.dev/libraries/${version}.zip" -o "/tmp/unity-${version}.zip"; then
              unzip -t "/tmp/unity-${version}.zip"
              unzip -l "/tmp/unity-${version}.zip" | head -40
              exit 0
            fi
          done
          exit 1
