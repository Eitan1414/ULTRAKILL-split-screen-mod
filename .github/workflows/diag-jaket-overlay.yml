name: Diagnose Jaket Mobile overlay blocks

on:
  push:
    branches:
      - jaket-mobile-v0.1-build
    paths:
      - '.github/workflows/diag-jaket-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect embedded mobile project and library layout
        shell: bash
        run: |
          set -euxo pipefail
          SNAPSHOT=261fc85d715650c41b77f258cc2b72f3c7658a4e
          : > /tmp/overlay.b64
          for n in 01 02 03 04 05 06 07; do
            git show "$SNAPSHOT:jaket-mobile-ci/overlay.b64.$n" >> /tmp/overlay.b64
          done
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.xz
          rm -rf /tmp/jm-inspect
          mkdir -p /tmp/jm-inspect
          tar -xJf /tmp/overlay.tar.xz -C /tmp/jm-inspect

          echo '=== EMBEDDED JAKET.CSPROJ ==='
          cat /tmp/jm-inspect/Jaket.csproj || true
          echo '=== LIB TREE ==='
          find /tmp/jm-inspect/lib -maxdepth 3 -type f -printf '%P %s bytes\n' | sort || true
          echo '=== TOP-LEVEL FILES ==='
          find /tmp/jm-inspect -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
