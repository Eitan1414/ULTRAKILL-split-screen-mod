name: Diagnose Jaket Mobile dependencies

on:
  push:
    branches:
      - jaket-mobile-v0.1-build
    paths:
      - '.github/workflows/diag-jaket-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Search BepInEx NuGet feed
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE='https://nuget.bepinex.dev/v3/index.json'
          for package in \
            UnityEngine.UI \
            Unity.TextMeshPro \
            Unity.Addressables \
            Unity.ResourceManager \
            UnityUIExtensions; do
            echo "===== $package ====="
            dotnet package search "$package" --source "$SOURCE" --take 25 --format json || true
          done
