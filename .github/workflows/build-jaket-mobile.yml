name: Build Jaket Mobile v0.1

on:
  push:
    branches:
      - jaket-mobile-v0.1-build
    paths:
      - 'jaket-mobile-ci/**'
      - '.github/workflows/build-jaket-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Recover mobile overlay
        shell: bash
        run: |
          set -euxo pipefail
          SNAPSHOT=261fc85d715650c41b77f258cc2b72f3c7658a4e
          : > /tmp/jm-overlay.b64
          for n in $(seq -w 1 11); do
            git show "$SNAPSHOT:jaket-mobile-ci/overlay.b64.$n" >> /tmp/jm-overlay.b64
          done
          base64 -d /tmp/jm-overlay.b64 > /tmp/jm-overlay.raw.zip

          echo '=== raw archive ==='
          ls -l /tmp/jm-overlay.raw.zip
          unzip -t /tmp/jm-overlay.raw.zip || true

          echo '=== Info-ZIP recovery ==='
          rm -f /tmp/jm-overlay.zip
          set +e
          zip -FF /tmp/jm-overlay.raw.zip --out /tmp/jm-overlay.zip </dev/null
          ZIP_RC=$?
          set -e
          echo "zip-FF-rc=$ZIP_RC"

          if [ -f /tmp/jm-overlay.zip ] && unzip -t /tmp/jm-overlay.zip; then
            echo 'Recovered overlay is valid.'
            exit 0
          fi

          echo '=== map central directory to actual local headers ==='
          python3 - <<'PY'
          from pathlib import Path
          import struct

          data = Path('/tmp/jm-overlay.raw.zip').read_bytes()
          LOCAL = b'PK\x03\x04'
          CENTRAL = b'PK\x01\x02'
          EOCD = b'PK\x05\x06'

          eocd = data.rfind(EOCD)
          if eocd < 0:
              raise SystemExit('EOCD not found')
          count = struct.unpack_from('<H', data, eocd + 10)[0]
          cd_size = struct.unpack_from('<I', data, eocd + 12)[0]
          claimed_cd = struct.unpack_from('<I', data, eocd + 16)[0]
          actual_cd = eocd - cd_size
          print(f'len={len(data)} eocd={eocd} count={count} claimed_cd={claimed_cd} actual_cd={actual_cd} delta={actual_cd-claimed_cd}')

          central = []
          p = actual_cd
          for i in range(count):
              if data[p:p+4] != CENTRAL:
                  raise SystemExit(f'bad central signature at {p}')
              fn = struct.unpack_from('<H', data, p+28)[0]
              ex = struct.unpack_from('<H', data, p+30)[0]
              co = struct.unpack_from('<H', data, p+32)[0]
              off = struct.unpack_from('<I', data, p+42)[0]
              csize = struct.unpack_from('<I', data, p+20)[0]
              usize = struct.unpack_from('<I', data, p+24)[0]
              crc = struct.unpack_from('<I', data, p+16)[0]
              method = struct.unpack_from('<H', data, p+10)[0]
              name = data[p+46:p+46+fn].decode('utf-8','replace')
              central.append((name, off, csize, usize, crc, method))
              p += 46 + fn + ex + co

          locals_by_name = {}
          p = 0
          while True:
              p = data.find(LOCAL, p)
              if p < 0:
                  break
              if p + 30 <= len(data):
                  fn = struct.unpack_from('<H', data, p+26)[0]
                  ex = struct.unpack_from('<H', data, p+28)[0]
                  if fn and fn < 512 and p + 30 + fn + ex <= len(data):
                      raw = data[p+30:p+30+fn]
                      try:
                          name = raw.decode('utf-8')
                      except UnicodeDecodeError:
                          name = None
                      if name and ('/' in name or '.' in name):
                          locals_by_name.setdefault(name, []).append(p)
              p += 1

          print(f'actual-local-headers={sum(len(v) for v in locals_by_name.values())} unique-names={len(locals_by_name)}')
          for i, (name, claimed, csize, usize, crc, method) in enumerate(central, 1):
              actuals = locals_by_name.get(name, [])
              if actuals:
                  actual = min(actuals, key=lambda x: abs(x-claimed))
                  delta = actual - claimed
                  print(f'{i:02d} claimed={claimed:6d} actual={actual:6d} delta={delta:6d} csize={csize:5d} method={method} {name}')
              else:
                  print(f'{i:02d} claimed={claimed:6d} actual=NONE   delta=NONE   csize={csize:5d} method={method} {name}')

          raise SystemExit('Info-ZIP could not recover archive; mapping printed above')
          PY

      - name: Checkout pinned JAKET source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/xzxADIxzx/Join-and-kill-em-together.git upstream-jaket
          cd upstream-jaket
          git checkout 1f19c835d993255f58262a8e8f60559260546397
          rm -f assets/assets.bundle
          unzip -oq /tmp/jm-overlay.zip -d .
          cp ../jaket-mobile-ci/Jaket.Mobile.CI.csproj ./Jaket.Mobile.CI.csproj

      - name: Restore
        working-directory: upstream-jaket
        run: dotnet restore Jaket.Mobile.CI.csproj

      - name: Build mobile plugin
        working-directory: upstream-jaket
        run: dotnet build Jaket.Mobile.CI.csproj -c Release --no-restore -o ../dist

      - name: Assemble test package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package/JaketMobile/bundles
          cp dist/Jaket.Mobile.dll package/JaketMobile/
          cp upstream-jaket/assets/bundles/*.properties package/JaketMobile/bundles/ || true
          cp upstream-jaket/README.md package/JaketMobile/README.md
          (cd package && zip -r ../Jaket-Mobile-v0.1-CI.zip JaketMobile)

      - name: Upload plugin artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jaket-Mobile-v0.1-CI
          path: Jaket-Mobile-v0.1-CI.zip
          if-no-files-found: error
          retention-days: 30
