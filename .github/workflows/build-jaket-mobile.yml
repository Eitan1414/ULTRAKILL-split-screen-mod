name: Build Jaket Mobile v0.1

on:
  push:
    branches:
      - jaket-mobile-v0.1-build
    paths:
      - 'jaket-mobile-ci/**'
      - '.github/workflows/build-jaket-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Reconstruct and repair mobile overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat jaket-mobile-ci/overlay.b64.* | base64 -d > /tmp/jm-overlay.raw.zip

          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zipfile

          raw_path = Path('/tmp/jm-overlay.raw.zip')
          clean_path = Path('/tmp/jm-overlay.zip')
          data = bytearray(raw_path.read_bytes())
          print(f'overlay-bytes={len(data)}')

          eocd = data.rfind(b'PK\x05\x06')
          if eocd < 0:
              raise SystemExit('EOCD signature not found')

          entries = struct.unpack_from('<H', data, eocd + 10)[0]
          cd_size = struct.unpack_from('<I', data, eocd + 12)[0]
          cd_offset = struct.unpack_from('<I', data, eocd + 16)[0]
          expected_size = cd_offset + cd_size + 22
          print(f'eocd={eocd} entries={entries} cd_offset={cd_offset} cd_size={cd_size} expected-size={expected_size} delta={len(data)-expected_size}')

          candidates = []
          start = max(0, cd_offset - 32)
          end = min(len(data), cd_offset + 32)
          pos = data.find(b'PK\x01\x02', start, end)
          while pos >= 0:
              candidates.append(pos)
              pos = data.find(b'PK\x01\x02', pos + 1, end)
          print(f'central-directory-candidates={candidates}')

          # Python's zipfile is tolerant of a global central-directory displacement.
          # If every payload can still be read and CRC-checked, repack it into a clean ZIP.
          failures = []
          recovered = []
          try:
              with zipfile.ZipFile(raw_path, 'r') as source:
                  print(f'zipfile-entries={len(source.infolist())}')
                  for info in source.infolist():
                      try:
                          payload = source.read(info)
                          recovered.append((info, payload))
                      except Exception as exc:
                          failures.append((info.filename, repr(exc)))
                          print(f'READ-FAIL {info.filename}: {exc!r}')
          except Exception as exc:
              print(f'ZIP-OPEN-FAIL: {exc!r}')
              failures.append(('<archive>', repr(exc)))

          if not failures and recovered:
              with zipfile.ZipFile(clean_path, 'w', compression=zipfile.ZIP_DEFLATED) as target:
                  for info, payload in recovered:
                      zi = zipfile.ZipInfo(info.filename, date_time=info.date_time)
                      zi.external_attr = info.external_attr
                      zi.internal_attr = info.internal_attr
                      zi.create_system = info.create_system
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      target.writestr(zi, payload)
              print('overlay-repacked-with-zipfile')
              raise SystemExit(0)

          # If only the EOCD central-directory pointer is displaced by two bytes,
          # repair that field and let unzip validate the result.
          if candidates:
              nearest = min(candidates, key=lambda value: abs(value - cd_offset))
              displacement = nearest - cd_offset
              print(f'nearest-central-directory={nearest} displacement={displacement}')
              if displacement in (-2, 2):
                  repaired = bytearray(data)
                  struct.pack_into('<I', repaired, eocd + 16, nearest)
                  clean_path.write_bytes(repaired)
                  print('overlay-eocd-offset-repaired')
                  raise SystemExit(0)

          # Keep the raw archive so the following unzip command prints the native error.
          clean_path.write_bytes(data)
          raise SystemExit('Could not safely repair overlay; see diagnostics above')
          PY

          unzip -t /tmp/jm-overlay.zip

      - name: Checkout pinned JAKET source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/xzxADIxzx/Join-and-kill-em-together.git upstream-jaket
          cd upstream-jaket
          git checkout 1f19c835d993255f58262a8e8f60559260546397
          rm -f assets/assets.bundle
          unzip -oq /tmp/jm-overlay.zip -d .
          cp ../jaket-mobile-ci/Jaket.Mobile.CI.csproj ./Jaket.Mobile.CI.csproj

      - name: Restore
        working-directory: upstream-jaket
        run: dotnet restore Jaket.Mobile.CI.csproj

      - name: Build mobile plugin
        working-directory: upstream-jaket
        run: dotnet build Jaket.Mobile.CI.csproj -c Release --no-restore -o ../dist

      - name: Assemble test package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package/JaketMobile/bundles
          cp dist/Jaket.Mobile.dll package/JaketMobile/
          cp upstream-jaket/assets/bundles/*.properties package/JaketMobile/bundles/ || true
          cp upstream-jaket/README.md package/JaketMobile/README.md
          (cd package && zip -r ../Jaket-Mobile-v0.1-CI.zip JaketMobile)

      - name: Upload plugin artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jaket-Mobile-v0.1-CI
          path: Jaket-Mobile-v0.1-CI.zip
          if-no-files-found: error
          retention-days: 30
