name: Build Jaket Mobile v0.1

on:
  push:
    branches:
      - jaket-mobile-v0.1-build
    paths:
      - 'jaket-mobile-ci/**'
      - '.github/workflows/build-jaket-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Recover clean mobile overlay
        shell: bash
        run: |
          set -euxo pipefail

          # 261fc85... is the last snapshot before the later partial "Refresh"
          # replacements. It contains the complete 11-part overlay, but the ZIP
          # is exactly two bytes short in one local file payload.
          SNAPSHOT=261fc85d715650c41b77f258cc2b72f3c7658a4e
          : > /tmp/jm-overlay.b64
          for n in $(seq -w 1 11); do
            git show "$SNAPSHOT:jaket-mobile-ci/overlay.b64.$n" >> /tmp/jm-overlay.b64
          done
          base64 -d /tmp/jm-overlay.b64 > /tmp/jm-overlay.raw.zip

          python3 - <<'PY'
          from pathlib import Path
          import binascii
          import struct
          import zlib
          import zipfile

          raw_path = Path('/tmp/jm-overlay.raw.zip')
          fixed_path = Path('/tmp/jm-overlay.zip')
          data = bytearray(raw_path.read_bytes())

          LOCAL = b'PK\x03\x04'
          CENTRAL = b'PK\x01\x02'
          EOCD = b'PK\x05\x06'

          eocd = data.rfind(EOCD)
          if eocd < 0:
              raise SystemExit('EOCD signature not found')

          count = struct.unpack_from('<H', data, eocd + 10)[0]
          cd_size = struct.unpack_from('<I', data, eocd + 12)[0]
          claimed_cd = struct.unpack_from('<I', data, eocd + 16)[0]
          actual_cd = eocd - cd_size
          expected_size = claimed_cd + cd_size + 22
          print(f'overlay-bytes={len(data)} expected={expected_size} delta={len(data)-expected_size}')
          print(f'entries={count} claimed-cd={claimed_cd} actual-cd={actual_cd} cd-delta={actual_cd-claimed_cd}')

          if len(data) - expected_size != -2:
              raise SystemExit('Overlay no longer matches the known two-byte-loss signature')
          if data[actual_cd:actual_cd+4] != CENTRAL:
              raise SystemExit('Could not locate actual central directory')

          infos = []
          pos = actual_cd
          for index in range(count):
              if data[pos:pos+4] != CENTRAL:
                  raise SystemExit(f'Bad central-directory signature at entry {index+1}, offset {pos}')
              flags = struct.unpack_from('<H', data, pos + 8)[0]
              method = struct.unpack_from('<H', data, pos + 10)[0]
              crc = struct.unpack_from('<I', data, pos + 16)[0]
              csize = struct.unpack_from('<I', data, pos + 20)[0]
              usize = struct.unpack_from('<I', data, pos + 24)[0]
              fnlen = struct.unpack_from('<H', data, pos + 28)[0]
              extralen = struct.unpack_from('<H', data, pos + 30)[0]
              commentlen = struct.unpack_from('<H', data, pos + 32)[0]
              local_off = struct.unpack_from('<I', data, pos + 42)[0]
              name = bytes(data[pos+46:pos+46+fnlen]).decode('utf-8', 'replace')
              infos.append({
                  'index': index + 1,
                  'name': name,
                  'flags': flags,
                  'method': method,
                  'crc': crc,
                  'csize': csize,
                  'usize': usize,
                  'local_off': local_off,
              })
              pos += 46 + fnlen + extralen + commentlen

          # Find the point where local-header offsets start being two bytes early.
          deltas = []
          for info in infos:
              off = info['local_off']
              if data[off:off+4] == LOCAL:
                  delta = 0
              elif off >= 2 and data[off-2:off+2] == LOCAL:
                  delta = -2
              elif data[off+2:off+6] == LOCAL:
                  delta = 2
              else:
                  delta = None
              deltas.append(delta)
              print(f"entry={info['index']:02d} delta={delta!s:>4} offset={off:5d} {info['name']}")

          transition = None
          for i in range(1, len(deltas)):
              if deltas[i-1] == 0 and deltas[i] == -2:
                  transition = i
                  break

          if transition is None:
              raise SystemExit('Could not locate 0 -> -2 local-header transition')

          previous = infos[transition - 1]
          following = infos[transition]
          prev_off = previous['local_off']
          next_actual = following['local_off'] - 2
          print(f"two-byte loss is between {previous['name']} and {following['name']} at raw offset {next_actual}")

          if data[prev_off:prev_off+4] != LOCAL:
              raise SystemExit('Previous local header is not intact')

          local_flags = struct.unpack_from('<H', data, prev_off + 6)[0]
          local_method = struct.unpack_from('<H', data, prev_off + 8)[0]
          fnlen = struct.unpack_from('<H', data, prev_off + 26)[0]
          extralen = struct.unpack_from('<H', data, prev_off + 28)[0]
          payload_start = prev_off + 30 + fnlen + extralen
          available = next_actual - payload_start
          missing = previous['csize'] - available
          print(f"previous={previous['name']} method={previous['method']} flags=0x{previous['flags']:04x} csize={previous['csize']} available={available} missing={missing}")

          if previous['method'] != 8 or local_method != 8:
              raise SystemExit('Known damaged entry is not DEFLATE-compressed')
          if local_flags & 0x08:
              raise SystemExit('Unexpected data descriptor on damaged entry')
          if missing != 2:
              raise SystemExit(f'Expected exactly two missing compressed bytes, got {missing}')

          damaged_payload = bytes(data[payload_start:next_actual])
          wanted_crc = previous['crc']
          wanted_size = previous['usize']
          recovered_bytes = None

          # The two missing bytes are at the end of this compressed payload.
          # There are only 65,536 possibilities; CRC32 + uncompressed size gives
          # an exact check without guessing source text.
          for value in range(65536):
              suffix = bytes((value & 0xff, value >> 8))
              try:
                  plain = zlib.decompress(damaged_payload + suffix, -15)
              except zlib.error:
                  continue
              if len(plain) != wanted_size:
                  continue
              if (binascii.crc32(plain) & 0xffffffff) != wanted_crc:
                  continue
              recovered_bytes = suffix
              print(f'recovered-missing-bytes={suffix.hex()} candidate={value}')
              break

          if recovered_bytes is None:
              raise SystemExit('Could not recover the two missing DEFLATE bytes')

          repaired = data[:next_actual] + recovered_bytes + data[next_actual:]
          fixed_path.write_bytes(repaired)
          print(f'repaired-overlay-bytes={len(repaired)}')

          with zipfile.ZipFile(fixed_path, 'r') as archive:
              bad = archive.testzip()
              print(f'zipfile-test={bad!r}')
              if bad is not None:
                  raise SystemExit(f'CRC/decompression failure after repair: {bad}')
              print(f'validated-entries={len(archive.infolist())}')
          PY

          unzip -t /tmp/jm-overlay.zip

      - name: Checkout pinned JAKET source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/xzxADIxzx/Join-and-kill-em-together.git upstream-jaket
          cd upstream-jaket
          git checkout 1f19c835d993255f58262a8e8f60559260546397
          rm -f assets/assets.bundle
          unzip -oq /tmp/jm-overlay.zip -d .
          cp ../jaket-mobile-ci/Jaket.Mobile.CI.csproj ./Jaket.Mobile.CI.csproj

      - name: Restore
        working-directory: upstream-jaket
        run: dotnet restore Jaket.Mobile.CI.csproj

      - name: Build mobile plugin
        working-directory: upstream-jaket
        run: dotnet build Jaket.Mobile.CI.csproj -c Release --no-restore -o ../dist

      - name: Assemble test package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package/JaketMobile/bundles
          cp dist/Jaket.Mobile.dll package/JaketMobile/
          cp upstream-jaket/assets/bundles/*.properties package/JaketMobile/bundles/ || true
          cp upstream-jaket/README.md package/JaketMobile/README.md
          (cd package && zip -r ../Jaket-Mobile-v0.1-CI.zip JaketMobile)

      - name: Upload plugin artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jaket-Mobile-v0.1-CI
          path: Jaket-Mobile-v0.1-CI.zip
          if-no-files-found: error
          retention-days: 30
